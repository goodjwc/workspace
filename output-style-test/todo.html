<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>투두 리스트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
      min-height: 100vh;
    }

    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 32px;
      width: 100%;
      max-width: 480px;
      height: fit-content;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 24px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .input-row input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus { border-color: #5c6bc0; }

    .input-row button {
      padding: 10px 18px;
      background: #5c6bc0;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .input-row button:hover { background: #3f51b5; }

    .stats {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 12px;
    }

    #todo-list { list-style: none; }

    #todo-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 8px;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.15s;
    }

    #todo-list li:last-child { border-bottom: none; }
    #todo-list li:hover { background: #fafafa; border-radius: 8px; }

    #todo-list li input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: #5c6bc0;
      cursor: pointer;
      flex-shrink: 0;
    }

    .todo-text {
      flex: 1;
      font-size: 0.95rem;
      color: #333;
      word-break: break-word;
    }

    .todo-text.done {
      text-decoration: line-through;
      color: #aaa;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ccc;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.15s;
    }

    .delete-btn:hover { color: #e53935; }

    .empty {
      text-align: center;
      color: #bbb;
      font-size: 0.9rem;
      padding: 32px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✅ 투두 리스트</h1>

    <div class="input-row">
      <input type="text" id="todo-input" placeholder="할 일을 입력하세요..." />
      <button onclick="addTodo()">추가</button>
    </div>

    <div class="stats" id="stats"></div>
    <ul id="todo-list"></ul>
  </div>

  <script>
    let todos = JSON.parse(localStorage.getItem('todos') || '[]');

    function save() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    function render() {
      const list = document.getElementById('todo-list');
      const stats = document.getElementById('stats');
      const done = todos.filter(t => t.done).length;

      stats.textContent = todos.length
        ? `총 ${todos.length}개 · 완료 ${done}개`
        : '';

      if (todos.length === 0) {
        list.innerHTML = '<p class="empty">할 일이 없습니다. 추가해보세요!</p>';
        return;
      }

      list.innerHTML = todos.map((todo, i) => `
        <li>
          <input type="checkbox" ${todo.done ? 'checked' : ''}
            onchange="toggle(${i})" />
          <span class="todo-text ${todo.done ? 'done' : ''}">${escapeHtml(todo.text)}</span>
          <button class="delete-btn" onclick="remove(${i})" title="삭제">✕</button>
        </li>
      `).join('');
    }

    function addTodo() {
      const input = document.getElementById('todo-input');
      const text = input.value.trim();
      if (!text) return;
      todos.push({ text, done: false });
      input.value = '';
      save();
      render();
    }

    function toggle(i) {
      todos[i].done = !todos[i].done;
      save();
      render();
    }

    function remove(i) {
      todos.splice(i, 1);
      save();
      render();
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    document.getElementById('todo-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') addTodo();
    });

    render();
  </script>
</body>
</html>
